name: Update contribution snake

on:
  schedule:
    - cron: '29 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/galaga.yml'

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'TianLu-hub/TianLu-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from TianLu-hub's real contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: TianLu-hub
          github_token: ${{ github.token }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%238b5cf6
            dist/snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%2330363d,%230e4429,%23006d32,%2326a641,%2339d353
      - name: Validate both animated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import xml.etree.ElementTree as ET
          for name in ['snake.svg', 'snake-dark.svg']:
              path = Path('dist') / name
              data = path.read_text()
              assert ET.fromstring(data).tag == '{http://www.w3.org/2000/svg}svg'
              assert '@keyframes' in data and 'animation' in data
              assert 0 < path.stat().st_size < 10 * 1024 * 1024
              assert '<script' not in data and '<foreignObject' not in data
          Path('dist/snake-state.json').write_text(json.dumps({
              'username': 'TianLu-hub',
              'source': 'https://api.github.com/graphql',
              'renderer': 'Platane/snk',
              'upstream_commit': 'd8f6715049803e982ee5ff501b6b9b7d5deeb09b',
              'generated_at': datetime.now(timezone.utc).isoformat(),
          }, indent=2) + '\n')
          print('Both real-contribution snake SVGs are valid.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: contribution-snake
          path: |
            dist/snake.svg
            dist/snake-dark.svg
            dist/snake-state.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: contribution-snake
          path: ${{ runner.temp }}/contribution-snake
      - name: Publish the snake on its own branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin snake > /dev/null; then
            git fetch origin snake
            git checkout -B snake FETCH_HEAD
          else
            git checkout --orphan snake
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/contribution-snake/snake.svg" snake.svg
          cp "$RUNNER_TEMP/contribution-snake/snake-dark.svg" snake-dark.svg
          cp "$RUNNER_TEMP/contribution-snake/snake-state.json" snake-state.json
          git add snake.svg snake-dark.svg snake-state.json
          if git diff --cached --quiet; then
            echo 'Snake animation already up to date.'
            exit 0
          fi
          git commit -m 'Refresh contribution snake'
          git push origin HEAD:snake
