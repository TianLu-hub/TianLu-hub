name: Update living study

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'study.json'
      - '.github/workflows/update-study.yml'

permissions:
  contents: write

concurrency:
  group: living-study
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'TianLu-hub/TianLu-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check weather interpretation and SVG rendering
        run: python3 -m unittest discover -s tests -v
      - name: Fetch New York weather and render scene
        run: python3 scripts/update_scene.py
      - name: Publish changed scene
        run: |
          git add assets/night-header.svg assets/night-footer.svg assets/study-state.json
          if git diff --cached --quiet; then
            echo 'Scene already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh New York study weather'
          git push origin HEAD:main
